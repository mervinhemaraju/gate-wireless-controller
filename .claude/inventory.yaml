# Inventory for the gate wireless controller project (Phase 1).
# Quantities include a spare where the part is cheap and easy to fry.
# Build is solder-free: every part is a module with screw terminals,
# connected module to module with ferruled wire. No soldering needed.

already_have:
  - item: Centurion D3 sliding gate motor
    notes: CP80 control board, 12V battery-backed system

  - item: Centurion NOVA remotes
    quantity: 2
    notes: Keep working unchanged; one at home, one in the car

  - item: Raspberry Pi 5
    notes: Always powered, indoors, within WiFi reach of the gate

  - item: Home WiFi network
    notes: Coverage at the gate motor must be verified before Phase 3 install

  - item: Android/iOS phone
    notes: Runs the Flutter app; reaches the Pi through the Cloudflare Tunnel,
      carrying a Zero Trust Access credential

  - item: Multimeter
    notes: Verify the 12V aux and status LED voltages before wiring anything

  - item: Buck converter, 12V to 5V
    quantity: 2
    notes: Powers the ESP32 from the CP80 12V aux output; one spare

  - item: Relay module, single-channel, opto-isolated, HW-803
    quantity: 1
    notes: Pulses TRG to COM on the CP80 (gate trigger). Corrected 2026-07-28 =
      silkscreen confirms single-channel ("1 Relay Module high/low level
      trigger"), not the 2-channel part earlier notes assumed - no spare
      channel on this board for the Phase 5 pedestrian-mode input, which
      will need its own relay. Relay coil is JQC3F-05VDC-C, 5V DC rated
      (not 3.3V); logic IN pin is opto-isolated and separate from the coil
      supply. Board has an H/L jumper selecting high- or low-level trigger
      on IN - bench test needed to confirm which position works before
      wiring (Stage A.2).

  - item: Cable ties
    quantity: 1

  - item: Ferrule crimper
    quantity: 1
    notes: DL-6, 0.06-6mm / AWG28-10 range; comfortably covers the 22AWG
      hookup wire used throughout this build

  - item: ESP32 dev board
    quantity: 2
    notes: 30-pin ESP32, CP2102 TYPE-C variant; on-gate controller, second
      board is a spare and doubles as an ESP-NOW bridge if WiFi at the
      gate turns out to be too weak

  - item: ESP32 screw-terminal breakout board
    quantity: 1
    notes: Pin-matched to the 30-pin ESP32; every GPIO becomes a screw
      terminal, no soldering and good vibration resistance

  - item: Ferrule crimp terminals, E0508 (0.5mm²)
    quantity: 1
    notes: Matches the 22AWG hookup wire and the DL-6 crimper already on
      hand

  - item: Wire stripper
    quantity: 1
    notes: QHTITEC multifunctional wire stripper/crimping pliers,
      0.2-6.0mm range

  - item: Wago-style lever connectors, 2273-202 (2-way)
    quantity: 1
    notes: Solder-free wire-to-wire joins (e.g. tapping the 12V aux line)

  - item: Mounting box
    quantity: 1
    notes: IP67 ABS enclosure, 95x65x55mm; fits the motor housing floor
      space (10x8cm, 8cm depth), dry-layout check still worth doing
      before drilling

  - item: USB cable for the ESP32 (data-capable)
    quantity: 1
    notes: Type-C, matches the CP2102 board; for flashing firmware

  - item: Heat shrink tubing, assorted sizes
    quantity: 1
    notes: 127-800pcs assorted kit; insulation and strain relief inside
      the motor housing

  - item: Hookup wire (stranded), 6 colors
    quantity: 1
    notes: UL1007 stranded, 22AWG, 6-color bundle. All module-to-module and
      CP80 wiring. Colour plan - Red=12V, Black=GND, Yellow=5V,
      Blue=trigger signal, Green=relay-to-CP80 loop, White=status LED chain.
      Arrived 2026-07-28

  - item: Resistor, 47R 5% (measured)
    quantity: 5
    notes: Found already on hand, separate from the in-transit 30-value
      assortment. Measured 48R on the 2k range [measured 2026-08-04],
      consistent with the yellow-violet-black-gold color code. Suitable
      for LED current-limiting in the Phase 2 firmware bench test
      (LED standing in for the relay on RELAY_TRIGGER_PIN).

in_transit:
  - item: Resistor assortment, 1/4W through-hole, E12 series (~100R to 10k)
    quantity: 1
    notes: 600pcs metal film kit, 1% tolerance, 30 values (10R-1M) x 20pcs
      each, boxed and labeled. For the resistor divider that replaces the
      optocoupler on the gate-status sense line (see
      docs/decisions/0002-resistor-divider-over-optocoupler.md). Specific
      divider values still to be picked once the CP80 LED terminal is
      measured under load in Phase 3.

to_buy: []  # empty: Phase 1 procurement complete

rejected:
  - item: Optocoupler module (PC817 breakout, 2-channel)
    reason: Bench-tested 2026-07-28 for the gate-status sense line. Onboard
      series resistor is 3k ohm on both input and output side (SMD marking
      `302`, both channels). Driven at both 3.3V and 5V from an ESP32, the
      sensed output never swung - flat 3.27V regardless of input state.
      Fails to switch reliably from a source in the CP80 LED terminal's
      class (~4.5V DC, 20mA max). Replaced by a plain resistor divider,
      which has no switching-current threshold to fail against and costs no
      isolation benefit, since the ESP32 and CP80 already share ground
      through the buck converter in this design. Full test in
      docs/wiring/01-optocoupler-front-end.md, decision in
      docs/decisions/0002-resistor-divider-over-optocoupler.md. Kept on the
      shelf; not rebought or reconsidered for this role.

optional:
  - item: Reed switch + magnet (gate rated)
    quantity: 1
    purpose: Hard closed-position confirmation; Phase 5, not needed for the
      first working version
    approx_price_usd: 5

  - item: WiFi repeater / outdoor access point
    quantity: 1
    purpose: Only if the WiFi coverage check at the gate fails
    approx_price_usd: 20-30
