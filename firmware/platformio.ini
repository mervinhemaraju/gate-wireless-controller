[env]
; -Iinclude shared by every environment: PlatformIO's automatic include/
; path injection did not reliably reach lib/ sources under the native test
; runner in practice, so it's made explicit here rather than relied upon.
build_flags = -Iinclude

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.0.4

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DUNIT_TEST
